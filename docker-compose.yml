version: '3.8'

services:
  gateway:
    build:
      context: ./infrastructure
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  database:
    image: postgres:14-alpine
    command: postgres -c listen_addresses='*'
    env_file:
      - .env
    volumes:
      - sienna_pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sienna_user -d pedro_sienna_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./services/frontend
    networks:
      - frontend_net
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
  backend:
    build: ./services/backend
    expose:
      - "4000"
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      database:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    restart: unless-stopped

  ai_service:
    build: ./services/ai-service
    env_file:
      - .env
    networks:
      - backend_net
      - frontend_net
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - backend_net
    restart: unless-stopped

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  sienna_pg_data:
    name: sienna_pg_data
  portainer_data:
    name: portainer_data
